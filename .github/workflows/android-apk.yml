name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# SECURITY FIX 2026-10-28: least privilege for this workflow. It builds a
# release APK and uploads it as an artifact — it needs no write access and
# no release publishing. (Action major-version pins are kept; pinning to
# full SHAs is a further hardening step, listed as needs-validation in the
# audit report, because it requires verifying each SHA out of band.)
#
# SIGNING 2026-10-28 (Play Protect batch): by default the release APK is
# signed with a fresh debug keystore generated per run (see the step
# below) — that is why every build has a different signature and Android
# forces an uninstall before reinstalling, and why Play Protect has never
# seen the app before. If the repo owner adds these four GitHub Actions
# secrets, the build uses a STABLE release key instead, with the debug
# keystore kept only as a fallback when the secrets are absent:
#   RELEASE_KEYSTORE_BASE64  — base64 of a private release keystore file
#   RELEASE_KEYSTORE_PASSWORD — keystore password
#   RELEASE_KEY_ALIAS        — key alias inside the keystore
#   RELEASE_KEY_PASSWORD     — key password
# Create the keystore ONCE on a private machine (never in the repo, never
# in chat): keytool -genkey -v -keystore botsquad-release.keystore
# -alias botsquad -keyalg RSA -keysize 2048 -validity 10000
# then base64 -w0 botsquad-release.keystore and paste that text as the
# secret. Back the keystore file and its passwords up safely: losing them
# means no future build can update the installed app — users would have
# to uninstall and reinstall. No secret value is ever echoed in logs.
permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE 2026-10-28: no separate Android SDK step — ubuntu-latest
      # already ships the Android SDK (ANDROID_HOME), and
      # android-actions/setup-android@v3 failed with
      # "Failed to find package 'tools'" / sdkmanager exit code 1,
      # because the old 'tools' package no longer exists in
      # cmdline-tools. Gradle picks up the runner's SDK directly.

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # NOTE: bun.lock is intentionally not in this repo (it exceeds the
        # GitHub App file API single-arg limit), so do NOT use --frozen-lockfile here.
        run: bun install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild Android
        run: CI=1 npx expo prebuild --platform android

      - name: Enable Jetifier
        # @react-native-voice/voice still depends on the old
        # com.android.support libraries (appcompat-v7, which pulls in
        # support versionedparcelable 28.0.0). Without Jetifier that
        # clashes with androidx versionedparcelable 1.1.1 and
        # :app:processDebugMainManifest fails with a manifest-merger
        # error. The generated gradle.properties does not set this,
        # so it is appended here after prebuild, before Gradle runs.
        run: echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Pin Kotlin version to 1.9.24
        # Run #4, line 337: Compose Compiler 1.5.15 requires Kotlin
        # 1.9.25, but the actual compiler is 1.9.24 — the version
        # React Native 0.76 ships (react-native/gradle/libs.versions.toml).
        # The template's build.gradle defaults to 1.9.25, and
        # expo-modules-core picks its Compose compiler from that
        # value, so the two disagree. Pinning android.kotlinVersion
        # to 1.9.24 makes expo-modules-core pick Compose 1.5.14,
        # which matches the compiler React Native actually uses.
        # This must run after prebuild, which regenerates the file.
        run: echo "android.kotlinVersion=1.9.24" >> android/gradle.properties

      - name: Increase Gradle heap
        # Run #3 got past the manifest merger, then failed at
        # :app:checkDebugAarMetadata with
        # "JetifierTransform: Java heap space" on react-android
        # 0.76.5-debug.aar. Expo's generated gradle.properties sets
        # only -Xmx2048m, which is too small for Jetifier on this
        # large AAR, so raise it to 4 GB before Gradle runs.
        # This must run after prebuild, which regenerates the file.
        run: |
          sed -i 's/-Xmx2048m/-Xmx4096m/; s/-XX:MaxMetaspaceSize=512m/-XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          grep org.gradle.jvmargs android/gradle.properties

      - name: Trim unneeded permissions (after prebuild)
        # expo prebuild regenerates AndroidManifest.xml from the app
        # template, which adds READ/WRITE_EXTERNAL_STORAGE and
        # SYSTEM_ALERT_WINDOW. None of them is needed: photo picking
        # uses the system picker (scoped storage) and document picking
        # uses the Storage Access Framework, and nothing in the app
        # draws over other apps. Broad storage + overlay permissions
        # are exactly what makes Play Protect more suspicious of a
        # sideloaded app, so strip those three lines and keep only
        # INTERNET, RECORD_AUDIO (voice input) and VIBRATE.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          lines = p.read_text().splitlines(keepends=True)
          drop = ('READ_EXTERNAL_STORAGE', 'WRITE_EXTERNAL_STORAGE', 'SYSTEM_ALERT_WINDOW')
          p.write_text(''.join(l for l in lines if not any(d in l for d in drop)))
          print('permissions trimmed')
          PY

      - name: Decode release keystore (if secrets set)
        # Optional stable signing (see the header comment). If any of
        # the four secrets is missing, this step does nothing and the
        # build falls back to the debug keystore below — the build
        # never breaks for lack of secrets. Secret values are never
        # echoed; they only land in the ephemeral runner's
        # gradle.properties, which is never committed or printed.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            printf 'BOTSQUAD_RELEASE_STORE_PASSWORD=%s\nBOTSQUAD_RELEASE_KEY_ALIAS=%s\nBOTSQUAD_RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEYSTORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" >> android/gradle.properties
            echo "release keystore decoded"
          else
            echo "release secrets incomplete or absent; using debug signing fallback"
          fi

      - name: Use release signing (if keystore present)
        # Patches the prebuild-generated build.gradle only when the
        # release keystore from the previous step exists. Any patch
        # failure prints a warning and the build continues with the
        # debug signing fallback — this step must never break a build.
        run: |
          python3 - <<'PY'
          import pathlib
          ks = pathlib.Path('android/app/release.keystore')
          if not ks.exists():
              print('no release keystore; keeping debug signing')
              raise SystemExit(0)
          p = pathlib.Path('android/app/build.gradle')
          t = p.read_text()
          debug_block = """    signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
          }"""
          release_block = """    signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
              release {
                  storeFile file('release.keystore')
                  storePassword project.findProperty('BOTSQUAD_RELEASE_STORE_PASSWORD')
                  keyAlias project.findProperty('BOTSQUAD_RELEASE_KEY_ALIAS')
                  keyPassword project.findProperty('BOTSQUAD_RELEASE_KEY_PASSWORD')
              }
          }"""
          if debug_block not in t:
              print('WARNING: debug signing block not found as expected; keeping debug signing')
              raise SystemExit(0)
          t = t.replace(debug_block, release_block, 1)
          idx = t.find('buildTypes {')
          rel = t.find('release {', idx)
          old = 'signingConfig signingConfigs.debug'
          pos = t.find(old, rel)
          if pos == -1:
              print('WARNING: release signingConfig line not found; keeping debug signing')
              raise SystemExit(0)
          t = t[:pos] + 'signingConfig signingConfigs.release' + t[pos + len(old):]
          p.write_text(t)
          print('release signing configured')
          PY

      - name: Generate debug keystore if missing
        # Fallback signing when no release secrets are set: the
        # release build below is signed with the debug signing
        # config, whose keystore is not committed to the repo.
        # Generate the standard debug keystore so the release APK
        # is installable. NOTE: each CI run is a fresh runner, so
        # this keystore (and the APK signature) changes per build —
        # uninstall the previous BotSquad APK before installing a
        # new one, or Android will refuse it as a signature mismatch.
        # This changes to a stable signature only once the release
        # secrets in the header comment are added.
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        # NOT assembleDebug: debug APKs skip JS bundling and load
        # the bundle from a Metro dev server at localhost:8081, so
        # a debug APK installed on a phone with no Metro running
        # shows "Could not connect to development server" /
        # "Unable to load script". A release APK bundles the JS
        # inside the APK and runs standalone, which is what a
        # GitHub-distributed APK needs. The release build type in
        # this template is signed with the debug keystore (see the
        # step above), so it stays installable without a real
        # release keystore.
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: botsquad-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
