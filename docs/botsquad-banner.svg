  <!-- Bot mark: simple geometric head, drawn in code -->
  <g>
    <line x1="180" y1="92" x2="180" y2="58" stroke="#E8A33D" stroke-width="10" stroke-linecap="round"/>
    <circle cx="180" cy="48" r="14" fill="#E8A33D"/>
    <rect x="90" y="92" width="180" height="168" rx="44" fill="#F2EDE4"/>
    <circle cx="140" cy="168" r="17" fill="#16130F"/>
    <circle cx="220" cy="168" r="17" fill="#16130F"/>
    <path d="M 140 212 Q 180 236 220 212" stroke="#16130F" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="330" y="185" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" fill="#F5F1E8" letter-spacing="-2">BotSquad</text>
